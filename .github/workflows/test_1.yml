name: Hola Mundo

# on: [push, pull_request]
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-build:
    runs-on: ubuntu-latest
    # Variables de entorno a nivel de job
    env:
      MY_VAR: "Hola Mundo"
    steps:
      - name: Echo Vars
        env:
          # Variables de entorno a nivel de step
          STEP_MY_VAR: "Hola Mundo"
        run: |
          echo 'Hola Variables de entorno: ${{env.MY_VAR}}'
          echo 'Hola Variables de entorno: ${{env.STEP_MY_VAR}}'
          echo 'Hola Variables GITHUB: ${{ vars.ENV_MY_VAR }}'
      - name: Secrets
        run: |
          echo 'Hola Secrets: ${{ secrets.MY_SECRET }}'
      - name: Example use ssh
        run: |
          mkdir -p ~/.ssh 
          echo "${{ secrets.SSH_KEY_EXAMPLE }}" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat ~/.ssh/id_rsa

